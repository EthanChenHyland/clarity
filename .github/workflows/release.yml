name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically trigger when you push a new version tag (e.g., v0.2.0)

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm test && node verify.js && node --check main.js && node --check renderer/renderer.js && git diff --check

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --arm64 --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder.cjs signs and notarizes only when MAC_SIGN=1; without
          # these it still builds ad-hoc, so the job keeps working as a build check.
          MAC_SIGN: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Preserve macOS packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clarity-macos-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload macOS archives to GitHub Release
        # Publish both architectures even without Apple credentials. Those
        # builds are ad-hoc signed and unnotarized; disclose this in the README
        # and release notes so users understand Gatekeeper warnings. An unsigned
        # rerun must never overwrite an existing (possibly signed) download.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          overwrite_files: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm test && node verify.js && node --check main.js && node --check renderer/renderer.js

      - name: Build Windows installer
        run: npm run dist:win

      - name: Build Windows 7 compatibility installer
        run: npm run dist:win7

      - name: Preserve Windows installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-windows-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Preserve Windows 7 installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-windows7-${{ github.ref_name }}
          path: dist-win7/*.exe
          if-no-files-found: error

      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist-win7/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

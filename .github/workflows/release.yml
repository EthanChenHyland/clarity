name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically trigger when you push a new version tag (e.g., v0.2.0)

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    env:
      # A runner with no certificate can only produce an ad-hoc macOS build, and
      # macOS refuses those after a download. Publishing one would overwrite a
      # signed release asset with an unopenable one, so the mac upload below is
      # gated on this. Set CSC_LINK and the APPLE_* secrets to turn it on.
      MAC_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm test && node verify.js && node --check main.js && node --check renderer/renderer.js && git diff --check

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --arm64 --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder.cjs signs and notarizes only when MAC_SIGN=1; without
          # these it still builds ad-hoc, so the job keeps working as a build check.
          MAC_SIGN: ${{ secrets.CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Preserve macOS packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clarity-macos-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        # Skipped on macOS until signing is configured, so an ad-hoc build can
        # never replace a signed asset already attached to the release.
        if: env.MAC_SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate
        run: npm test && node verify.js && node --check main.js && node --check renderer/renderer.js

      - name: Build Windows installer
        run: npm run dist:win

      - name: Preserve Windows installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-windows-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
